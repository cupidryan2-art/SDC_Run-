<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Care – township app concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4ECE9; --surface:#FFFFFF; --soft:#EDF4F1; --line:#D5E1DC;
  --ink:#14302A; --muted:#5A6F69; --brand:#0E5A4E; --brand-ink:#FFFFFF;
  --rain:#2C67C7; --rain-soft:#DCE7FA; --warn:#9A6212; --warn-soft:#FBEFD9;
  --danger:#B42318; --danger-soft:#FBE3E0; --ok:#1F7A4D; --ok-soft:#DDF2E6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0B1210; --surface:#16201D; --soft:#1D2A26; --line:#2B3B36;
    --ink:#E4EEEA; --muted:#9BB0A9; --brand:#5CC2AC; --brand-ink:#08201B;
    --rain:#83A9F2; --rain-soft:#1D2B45; --warn:#E5AF55; --warn-soft:#3A2D14;
    --danger:#F28A7E; --danger-soft:#43201C; --ok:#6FD39E; --ok-soft:#173326;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--ink);display:flex;justify-content:center;align-items:center;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--rain);outline-offset:2px}

.phone{width:390px;height:844px;background:var(--surface);border-radius:44px;box-shadow:0 0 0 10px #1c2523,0 30px 60px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:440px),(max-height:880px){
  body{align-items:stretch}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
}
.concept{font-size:11px;text-align:center;padding:6px 12px;background:var(--soft);color:var(--muted);padding-top:calc(6px + env(safe-area-inset-top,0px))}

header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--brand)}
.mode{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.mode button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

main{flex:1;overflow-y:auto;padding:4px 20px 24px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack>*+*{margin-top:10px}

/* rain strip: the one memorable element */
.rainbox{background:var(--rain-soft);border-radius:22px;padding:16px 16px 12px;margin-top:16px}
.rainhead{display:flex;justify-content:space-between;align-items:baseline}
.rainhead strong{font-size:15px}
.src{font-size:11px;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px;margin-top:12px;position:relative;align-items:end}
.threshold{position:absolute;left:0;right:0;border-top:1.5px dashed var(--rain);opacity:.7}
.threshold span{position:absolute;right:0;top:-17px;font-size:10px;color:var(--rain);font-weight:600}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--rain);opacity:.35;min-height:4px}
.bar.heavy i{opacity:1}
.bar b{font-size:11px;font-weight:700;margin-bottom:3px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;text-align:center;font-size:11px;color:var(--muted)}
.days .today{color:var(--ink);font-weight:700}

.alert{border-radius:18px;padding:14px 16px;border:1px solid transparent}
.alert.storm{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.aedes{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.alert.calm{background:var(--ok-soft)}
.alert h3{font-size:15px;font-weight:700}
.alert p{font-size:13.5px;margin-top:4px}
.alert .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.btn{background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.tile .ic{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.tile.new .ic{background:var(--brand);color:var(--brand-ink)}
.tile.new{color:var(--ink);font-weight:700}
.tile svg{width:24px;height:24px}

.point{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.point .name{font-weight:700}
.meter{grid-column:1/-1;height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:6px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.high{background:var(--danger-soft);color:var(--danger)}
.chip.med{background:var(--warn-soft);color:var(--warn)}
.chip.low{background:var(--ok-soft);color:var(--ok)}
.point .meta{font-size:13px;color:var(--muted)}

.daypick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.daypick button{flex:0 0 auto;width:58px;padding:8px 0;border-radius:14px;border:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.daypick button b{display:block;font-size:17px;color:var(--ink)}
.daypick button .r{display:block;font-size:10.5px;margin-top:2px}
.daypick button.wet .r{color:var(--rain);font-weight:700}
.daypick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.daypick button[aria-pressed="true"] b,.daypick button[aria-pressed="true"] .r{color:var(--brand-ink)}

.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--soft)}

.slot{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.slot .time{font-weight:800;font-size:16px;min-width:52px}
.slot .who{font-size:14px;font-weight:600}
.slot .nb{font-size:12.5px;color:var(--ok);font-weight:600}
.slot .price{text-align:right;font-weight:800}
.slot .price s{display:block;font-weight:500;font-size:12px;color:var(--muted)}

.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.list-plain>div{padding:10px 0;border-bottom:1px solid var(--line)}
.list-plain>div:last-child{border-bottom:none}
.note{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}

nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}

.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:19px;font-weight:800}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
select,input[type="time"]{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="concept">Concept prototype for the Township of Tomorrow hackathon. Prices and residents are sample data.</div>
  <header class="top">
    <div class="brand">My Township</div>
    <div class="mode" role="group" aria-label="View as">
      <button id="m-res" aria-pressed="true">Resident</button>
      <button id="m-wrk" aria-pressed="false">Cleaner</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* ---------- helpers ---------- */
const DAY = 86400000;
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const addDays = (d,n) => new Date(d.getTime() + n*DAY);
const daysSince = d => Math.round((TODAY - d)/DAY);
const wk = d => d.toLocaleDateString('en-MY',{weekday:'short'});
const dm = d => d.toLocaleDateString('en-MY',{day:'numeric',month:'short'});
const rel = d => { const n = Math.round((d-TODAY)/DAY); return n===0?'today':n===1?'tomorrow':'on '+wk(d); };
const sum = a => a.reduce((x,y)=>x+y,0);
const $ = s => document.querySelector(s);
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }

/* ---------- rules (tune after interviews) ---------- */
const RULES = { heavyRainMm:20, wetPast3dMm:30, dryDayMm:2, lookAheadDays:3 };
const SERVICES = { gutter:{label:'Roof gutters', price:70}, full:{label:'Full home check', price:120} };
const discountFor = n => n>=4?0.25 : n>=2?0.15 : n>=1?0.10 : 0;

/* ---------- sample data ---------- */
const HOME = { owner:'Aina', address:'No. 12, Jalan Cemara 3, Taman Hijau', street:'Jalan Cemara 3' };
const state = {
  mode:'resident', tab:'home', service:'gutter', pickDay:0,
  weather:null, source:'sample',
  points:[
    {id:'g1', name:'Front roof gutter', interval:30, last:addDays(TODAY,-41), tree:true},
    {id:'g2', name:'Rear roof gutter', interval:30, last:addDays(TODAY,-19), tree:false},
    {id:'bal', name:'Balcony floor trap', interval:14, last:addDays(TODAY,-16), tree:false},
    {id:'por', name:'Porch drain', interval:30, last:addDays(TODAY,-8), tree:false},
    {id:'yard', name:'Backyard drain', interval:21, last:addDays(TODAY,-24), tree:true},
  ],
  bookings:[], slots:[]
};
const CLEANERS = [
  {id:'c1', name:'Hafiz Drain Care', rating:4.8},
  {id:'c2', name:'KL Gutter Pro', rating:4.6},
  {id:'c3', name:'Siva & Sons Plumbing', rating:4.7},
];
(function makeSlots(){
  const r = rng(42);
  for(let d=0; d<7; d++){
    CLEANERS.forEach(c=>{
      ['09:00','11:00','14:00','16:30'].forEach(t=>{
        if(r()<0.45) state.slots.push({id:`${c.id}-${d}-${t}`, cleaner:c.id, day:d, time:t, neighbours:Math.floor(r()*5), takenByMe:false});
      });
    });
  }
})();
const SAMPLE_WEATHER = { past:[18,22,9], days:[0,1,26,34,0.5,0,12], prob:[20,30,80,90,25,15,55] };

/* ---------- weather (Open-Meteo, free, no key) ---------- */
async function loadWeather(){
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=3.107&longitude=101.607&daily=precipitation_sum,precipitation_probability_max&timezone=Asia%2FKuala_Lumpur&past_days=3&forecast_days=7';
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const j = await res.json();
    const p = j.daily.precipitation_sum, pr = j.daily.precipitation_probability_max;
    state.weather = {
      past: p.slice(0,3).map(v=>Math.round((v||0)*10)/10),
      days: p.slice(3,10).map((v,i)=>({date:addDays(TODAY,i), rain:Math.round((v||0)*10)/10, prob:pr[i+3]??0}))
    };
    state.source = 'live';
  }catch(e){
    state.weather = { past:SAMPLE_WEATHER.past, days:SAMPLE_WEATHER.days.map((v,i)=>({date:addDays(TODAY,i), rain:v, prob:SAMPLE_WEATHER.prob[i]})) };
    state.source = 'sample';
  }
  render();
}

/* ---------- risk logic ---------- */
function risk(p){
  const ratio = daysSince(p.last)/p.interval;
  const wetSoon = state.weather && state.weather.days.slice(0,RULES.lookAheadDays).some(d=>d.rain>=RULES.heavyRainMm);
  let score = ratio + (p.tree?0.15:0) + (wetSoon?0.1:0);
  return { ratio, level: score>=1?'high':score>=0.7?'med':'low' };
}
function alerts(){
  const w = state.weather; if(!w) return [];
  const out = [];
  const heavy = w.days.slice(0,RULES.lookAheadDays).find(d=>d.rain>=RULES.heavyRainMm);
  const due = state.points.filter(p=>risk(p).level!=='low');
  if(heavy && due.length){
    out.push({kind:'storm', title:`Heavy rain ${rel(heavy.date)}: ${heavy.rain} mm`,
      body:`${due.length} drain point${due.length>1?'s are':' is'} due for cleaning. Clear ${due.length>1?'them':'it'} first so water doesn’t back up onto your balcony or ceiling.`});
  }
  // breeding window: heavy rain followed by two dry days
  let windowDay = null;
  const pastWet = sum(w.past) >= RULES.wetPast3dMm;
  if(pastWet && w.days[0].rain<RULES.dryDayMm && w.days[1].rain<RULES.dryDayMm) windowDay = w.days[0].date;
  else for(let i=0;i<w.days.length-2;i++){
    if(w.days[i].rain>=RULES.heavyRainMm && w.days[i+1].rain<RULES.dryDayMm && w.days[i+2].rain<RULES.dryDayMm){ windowDay = w.days[i+1].date; break; }
  }
  if(windowDay){
    out.push({kind:'aedes', title:`Check for standing water ${rel(windowDay)}`,
      body:'Dry days right after heavy rain are when Aedes mosquitoes breed in water left in gutters and floor traps. A quick check stops a dengue risk at home.'});
  }
  if(!out.length) out.push({kind:'calm', title:'Nothing to do this week', body:'Your drains are on schedule and no heavy rain is forecast.'});
  return out;
}

/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 1 1 1-7.9A5 5 0 0 1 18 9a3 3 0 0 1 0 6H7z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  bill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
};

/* ---------- shared pieces ---------- */
function rainStrip(){
  const w = state.weather;
  const max = Math.max(40, ...w.days.map(d=>d.rain));
  const thrPct = RULES.heavyRainMm/max*100;
  return `<section class="rainbox" aria-label="Rain forecast for the next 7 days">
    <div class="rainhead"><strong>Rain this week</strong><span class="src">${state.source==='live'?'Live forecast, Open-Meteo':'Sample forecast (offline)'}</span></div>
    <div class="strip">
      <div class="threshold" style="bottom:${thrPct}%"><span>Heavy ${RULES.heavyRainMm} mm</span></div>
      ${w.days.map(d=>`<div class="bar ${d.rain>=RULES.heavyRainMm?'heavy':''}"><b>${d.rain}</b><i style="height:${Math.max(3,d.rain/max*100)}%"></i></div>`).join('')}
    </div>
    <div class="days">${w.days.map((d,i)=>`<span class="${i===0?'today':''}">${i===0?'Today':wk(d.date)}</span>`).join('')}</div>
  </section>`;
}
function alertCards(){
  return alerts().map(a=>`<div class="alert ${a.kind}"><h3>${a.title}</h3><p>${a.body}</p>
    ${a.kind==='calm'?'':`<div class="actions"><button class="btn small" data-go="book">Book a cleaner</button><button class="btn small ghost" data-go="myhome">I’ll do it myself</button></div>`}
  </div>`).join('');
}
function priceFor(slot){
  const base = SERVICES[state.service].price, d = discountFor(slot.neighbours);
  return { base, final: Math.round(base*(1-d)), d };
}
const cleanerName = id => CLEANERS.find(c=>c.id===id).name;

/* ---------- resident screens ---------- */
function screenHome(){
  const nb = state.bookings.length;
  return `<h1>Good morning, ${HOME.owner}</h1><p class="sub">${HOME.address}</p>
  ${rainStrip()}
  <h2>For your home</h2><div class="stack">${alertCards()}</div>
  ${nb?`<h2>Your bookings</h2><div class="card list-plain">${bookingRows()}</div>`:''}
  <h2>Services</h2>
  <div class="tiles">
    <div class="tile">${tileIc(I.bill)}Bills</div>
    <div class="tile">${tileIc(I.wrench)}Defects</div>
    <div class="tile">${tileIc(I.chat)}Enquiry</div>
    <button class="tile new" data-go="myhome">${tileIc(I.drop)}Home care</button>
  </div>`;
}
const tileIc = svg => `<span class="ic">${svg}</span>`;

function screenMyHome(){
  const rows = state.points.map(p=>{
    const r = risk(p), pct = Math.min(100, r.ratio*100);
    const color = r.level==='high'?'var(--danger)':r.level==='med'?'var(--warn)':'var(--ok)';
    return `<div class="card point">
      <span class="name">${p.name}</span>
      <span class="chip ${r.level}">${r.level==='high'?'Clean now':r.level==='med'?'Due soon':'OK'}</span>
      <span class="meta">Cleaned ${daysSince(p.last)} days ago, every ${p.interval} days${p.tree?', tree nearby':''}</span>
      <button class="btn small ghost" data-clean="${p.id}">Mark cleaned</button>
      <div class="meter"><i style="width:${pct}%;background:${color}"></i></div>
    </div>`;
  }).join('');
  return `<h1>My home</h1><p class="sub">${state.points.length} drain points at ${HOME.address.split(',')[0]}</p>
  <h2>Drain points</h2><div class="stack">${rows}</div>
  <p class="note" style="margin-top:14px">Cleaning intervals start from your house type and nearby trees. Mark a point as cleaned when you clear it yourself.</p>`;
}

function screenWeather(){
  const w = state.weather;
  const rows = w.days.map((d,i)=>`<div class="row"><span><b>${i===0?'Today':wk(d.date)}</b> <span class="note">${dm(d.date)}</span></span>
    <span>${d.rain>=RULES.heavyRainMm?'<span class="chip high">Heavy</span> ':''}<b>${d.rain} mm</b> <span class="note">${d.prob}%</span></span></div>`).join('');
  return `<h1>Rain and alerts</h1><p class="sub">Last 3 days: ${sum(w.past).toFixed(1)} mm of rain</p>
  ${rainStrip()}
  <h2>Next 7 days</h2><div class="card list-plain">${rows}</div>
  <h2>How alerts work</h2>
  <div class="card stack note">
    <p><b style="color:var(--ink)">Before heavy rain.</b> If more than ${RULES.heavyRainMm} mm is forecast within ${RULES.lookAheadDays} days and a drain point is due, you’re asked to clear it first.</p>
    <p><b style="color:var(--ink)">After heavy rain.</b> When heavy rain is followed by two dry days, you’re reminded to check gutters and floor traps for standing water, where Aedes mosquitoes breed.</p>
  </div>`;
}

function bookingRows(){
  if(!state.bookings.length) return '<div class="empty">No bookings yet.</div>';
  return state.bookings.map(b=>`<div class="row"><span><b>${b.done?'Cleaned':wk(addDays(TODAY,b.day))+' '+b.time}</b><br><span class="note">${b.service}, ${cleanerName(b.cleaner)}</span></span>
    <span class="chip ${b.done?'low':'med'}">${b.done?'Done':'RM '+b.price}</span></div>`).join('');
}

function screenBook(){
  const w = state.weather;
  const days = w.days.map((d,i)=>`<button data-day="${i}" aria-pressed="${state.pickDay===i}" class="${d.rain>=RULES.heavyRainMm?'wet':''}">${i===0?'Today':wk(d.date)}<b>${d.date.getDate()}</b><span class="r">${d.rain>=RULES.heavyRainMm?'Heavy rain':d.rain+' mm'}</span></button>`).join('');
  const slots = state.slots.filter(s=>s.day===state.pickDay && !s.takenByMe).sort((a,b)=>a.time.localeCompare(b.time));
  const slotRows = slots.length ? slots.map(s=>{
    const p = priceFor(s);
    return `<div class="card slot"><span class="time">${s.time}</span>
      <span><span class="who">${cleanerName(s.cleaner)}</span><br>
      ${s.neighbours?`<span class="nb">${s.neighbours} neighbour${s.neighbours>1?'s':''} on ${HOME.street} booked this run</span>`:'<span class="note">First on your street</span>'}</span>
      <span class="price">${p.d?`<s>RM ${p.base}</s>`:''}RM ${p.final}<br><button class="btn small" data-book="${s.id}" style="margin-top:6px">Book</button></span>
    </div>`;
  }).join('') : '<div class="empty">No open slots this day. Try another day.</div>';
  const heavyPicked = w.days[state.pickDay].rain>=RULES.heavyRainMm;
  return `<h1>Book a cleaner</h1><p class="sub">Neighbours who book the same run pay less.</p>
  ${state.bookings.length?`<h2>Your bookings</h2><div class="card list-plain">${bookingRows()}</div>`:''}
  <h2>What needs cleaning</h2>
  <div class="seg">${Object.entries(SERVICES).map(([k,v])=>`<button data-svc="${k}" aria-pressed="${state.service===k}">${v.label}<br><span class="note">from RM ${v.price}</span></button>`).join('')}</div>
  <h2>Pick a day</h2><div class="daypick">${days}</div>
  ${heavyPicked?'<p class="note" style="margin-top:8px;color:var(--warn)">Heavy rain is forecast this day. Pick an earlier day so the work is done before it arrives.</p>':''}
  <h2>Open slots</h2><div class="stack">${slotRows}</div>
  <p class="note" style="margin-top:14px">Street discount: 10% with 1 neighbour, 15% with 2–3, 25% with 4 or more.</p>`;
}

/* ---------- cleaner screens ---------- */
const ME_CLEANER = 'c1';
function screenJobs(){
  const mine = state.slots.filter(s=>s.cleaner===ME_CLEANER && (s.neighbours>0 || s.takenByMe)).sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));
  const myBookings = state.bookings.filter(b=>b.cleaner===ME_CLEANER);
  const rows = mine.length ? mine.map(s=>{
    const b = myBookings.find(x=>x.slot===s.id);
    const homes = s.neighbours + (s.takenByMe?1:0);
    return `<div class="card"><div class="row"><span><b>${s.day===0?'Today':wk(addDays(TODAY,s.day))} ${s.time}</b><br><span class="note">${HOME.street}, ${homes} home${homes>1?'s':''} in one trip</span></span>
      ${b && !b.done?`<label class="btn small" style="cursor:pointer">Upload after photo<input type="file" accept="image/*" data-done="${b.id}" hidden></label>`:b&&b.done?'<span class="chip low">Done</span>':''}</div>
      ${b?`<p class="note" style="margin-top:6px">Includes ${HOME.address.split(',')[0]} (${b.service})</p>`:''}
      ${b && b.photo?`<img src="${b.photo}" alt="After cleaning photo" style="margin-top:10px;width:100%;max-height:160px;object-fit:cover;border-radius:12px">`:''}
    </div>`;
  }).join('') : '<div class="empty">No jobs booked yet.</div>';
  return `<h1>My runs</h1><p class="sub">${cleanerName(ME_CLEANER)}</p>
  ${rainStrip()}
  <h2>Booked runs</h2><div class="stack">${rows}</div>`;
}
function screenSlots(){
  const open = state.slots.filter(s=>s.cleaner===ME_CLEANER).sort((a,b)=>a.day-b.day||a.time.localeCompare(b.time));
  const opts = state.weather.days.map((d,i)=>`<option value="${i}">${i===0?'Today':wk(d.date)} ${dm(d.date)}${d.rain>=RULES.heavyRainMm?' (heavy rain)':''}</option>`).join('');
  return `<h1>My time slots</h1><p class="sub">Residents can book any open slot.</p>
  <h2>Add a slot</h2>
  <div class="card row"><select id="newDay" aria-label="Day">${opts}</select><input id="newTime" type="time" value="10:00" aria-label="Time"><button class="btn small" id="addSlot">Add slot</button></div>
  <p class="note" style="margin-top:8px">Demand rises in the 2–3 days before heavy rain. Opening slots then fills your runs faster.</p>
  <h2>Open slots</h2>
  <div class="card list-plain">${open.map(s=>`<div class="row"><span><b>${s.day===0?'Today':wk(addDays(TODAY,s.day))} ${s.time}</b></span><span class="note">${s.neighbours+(s.takenByMe?1:0)} booked</span></div>`).join('')}</div>`;
}

/* ---------- render ---------- */
const TABS = {
  resident:[['home','Home',I.home],['myhome','My home',I.drop],['weather','Rain',I.cloud],['book','Book',I.cal]],
  worker:[['jobs','Runs',I.list],['slots','Slots',I.cal]]
};
function render(){
  const main = $('#main');
  if(!state.weather){ main.innerHTML = '<div class="empty">Loading forecast…</div>'; return; }
  const map = {home:screenHome, myhome:screenMyHome, weather:screenWeather, book:screenBook, jobs:screenJobs, slots:screenSlots};
  main.innerHTML = map[state.tab]();
  const tabs = TABS[state.mode==='resident'?'resident':'worker'];
  $('#tabs').style.gridTemplateColumns = `repeat(${tabs.length},1fr)`;
  $('#tabs').innerHTML = tabs.map(([id,label,ic])=>`<button data-tab="${id}" ${state.tab===id?'aria-current="page"':''}>${ic}${label}</button>`).join('');
}
function go(tab){ state.tab = tab; render(); $('#main').scrollTop = 0; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheetBg').classList.add('open'); }
function closeSheet(){ $('#sheetBg').classList.remove('open'); }

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) { if(e.target.id==='sheetBg') closeSheet(); return; }
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.svc){ state.service = t.dataset.svc; return render(); }
  if(t.dataset.day){ state.pickDay = +t.dataset.day; return render(); }
  if(t.dataset.clean){
    const p = state.points.find(x=>x.id===t.dataset.clean); p.last = new Date(TODAY); render(); return toast(`${p.name} marked as cleaned`);
  }
  if(t.dataset.book){
    const s = state.slots.find(x=>x.id===t.dataset.book), p = priceFor(s);
    return openSheet(`<h3>Confirm booking</h3>
      <div class="card list-plain" style="margin-top:14px">
        <div class="row"><span class="note">Service</span><b>${SERVICES[state.service].label}</b></div>
        <div class="row"><span class="note">When</span><b>${wk(addDays(TODAY,s.day))} ${dm(addDays(TODAY,s.day))}, ${s.time}</b></div>
        <div class="row"><span class="note">Cleaner</span><b>${cleanerName(s.cleaner)}</b></div>
        <div class="row"><span class="note">Price</span><b>RM ${p.final}${p.d?` <span class="note">(${Math.round(p.d*100)}% street discount)</span>`:''}</b></div>
      </div>
      <div class="row" style="margin-top:16px"><button class="btn ghost" id="cancelSheet">Cancel</button><button class="btn" id="confirmBook" data-slot="${s.id}">Confirm booking</button></div>`);
  }
  if(t.id==='cancelSheet') return closeSheet();
  if(t.id==='confirmBook'){
    const s = state.slots.find(x=>x.id===t.dataset.slot), p = priceFor(s);
    s.takenByMe = true;
    state.bookings.push({id:'b'+Date.now(), slot:s.id, cleaner:s.cleaner, day:s.day, time:s.time, service:SERVICES[state.service].label, price:p.final, done:false});
    closeSheet(); render(); return toast('Booking confirmed');
  }
  if(t.id==='addSlot'){
    const day = +$('#newDay').value, time = $('#newTime').value || '10:00';
    state.slots.push({id:`${ME_CLEANER}-${day}-${time}-${Date.now()}`, cleaner:ME_CLEANER, day, time, neighbours:0, takenByMe:false});
    render(); return toast('Slot added');
  }
  if(t.id==='m-res' || t.id==='m-wrk'){
    state.mode = t.id==='m-res'?'resident':'worker';
    $('#m-res').setAttribute('aria-pressed', state.mode==='resident');
    $('#m-wrk').setAttribute('aria-pressed', state.mode==='worker');
    return go(state.mode==='resident'?'home':'jobs');
  }
});
document.addEventListener('change', e=>{
  const inp = e.target; if(!inp.dataset.done || !inp.files[0]) return;
  const b = state.bookings.find(x=>x.id===inp.dataset.done);
  const reader = new FileReader();
  reader.onload = () => {
    b.photo = reader.result; b.done = true;
    // update the resident's drain points covered by this service
    state.points.filter(p=> b.service==='Roof gutters' ? p.id.startsWith('g') : true).forEach(p=>p.last = new Date(TODAY));
    render(); toast('Job marked done, resident notified');
  };
  reader.readAsDataURL(inp.files[0]);
});
render();
loadWeather();
</script>
</body>
</html>
